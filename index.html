<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poot Lab</title><meta name="theme-color" content="#7b3fe4"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#ffe76a,#ff9ad5 55%,#9b6bff);min-height:100vh;color:#2a1846}
main{max-width:520px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1{text-align:center;font-size:2.4rem;margin:.3em 0 0}.sub{text-align:center;margin:0 0 14px;font-weight:600}
.card{background:#fffdf7;border-radius:22px;padding:16px;box-shadow:0 6px 0 #2a184622,0 10px 30px #2a184633;margin-bottom:14px}
label{font-weight:700;display:block;margin-bottom:6px}.row{display:flex;gap:8px}
input[type=text]{flex:1;font-size:1.1rem;padding:12px;border:3px solid #2a1846;border-radius:14px;min-width:0}
button{font:inherit;font-weight:800;border:3px solid #2a1846;border-radius:14px;padding:12px;background:#fff;color:#2a1846;cursor:pointer;min-height:48px}
button:active{transform:translateY(2px)}button:focus-visible,input:focus-visible{outline:4px solid #7b3fe4;outline-offset:2px}
.big{width:100%;font-size:1.4rem;background:#7b3fe4;color:#fff;padding:16px;margin-top:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chips button{padding:8px 2px;font-size:.85rem}.chips span{display:block;font-size:1.6rem}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#result{text-align:center}#emoji{font-size:4rem;line-height:1}#emoji.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.4) rotate(-10deg)}}
.params{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;text-align:left;font-size:.9rem;margin-top:8px}
input[type=range]{width:100%;accent-color:#7b3fe4;height:32px}.small{font-size:.8rem;opacity:.8;text-align:center}
</style></head><body><main>
<h1>💨 Poot Lab</h1><p class="sub">Describe a mood. Hear the poot.</p>
<section class="card"><label for="desc">What kind of poot?</label>
<div class="row"><input id="desc" type="text" placeholder="e.g. angry tiny squeaky poot" autocomplete="off" enterkeyhint="go"><button id="mic" hidden aria-label="Speak description">🎤</button></div>
<button class="big" id="go">💨 Generate &amp; Play</button>
<div class="btns"><button id="replay" disabled>🔁 Replay</button><button id="random">🎲 Surprise</button><button id="stop">⏹ Stop</button></div></section>
<section class="card"><label>Mood presets</label><div class="chips" id="chips"></div></section>
<section class="card"><label for="dur">Length: <span id="durv">Auto</span></label><input id="dur" type="range" min="0" max="6" step="0.1" value="0" aria-describedby="durv">
<label for="int">Power: <span id="intv">70%</span></label><input id="int" type="range" min="0.1" max="1" step="0.05" value="0.7"></section>
<section class="card" id="result" aria-live="polite"><div id="emoji">🤔</div><div id="mood"><b>Type something and tap Generate</b></div><div id="why" class="small"></div><div class="params" id="params"></div>
<button id="dl" disabled style="margin-top:10px;width:100%">⬇️ Download WAV</button></section>
<p class="small">Sounds are made from scratch on your phone with math. Turn the ringer switch on to hear them on iPhone. Keyword matching—not AI.</p>
</main><script src="synth.js"></script><script src="app.js"></script></body></html>
